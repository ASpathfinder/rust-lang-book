name: Deploy Chinese Book to GitHub Pages

on:
  # 中文文档或构建工具合并到 main 后自动运行
  push:
    branches:
      - codex/rust-book-zh-cn
    paths:
      - "zh-cn/**"
      - "packages/mdbook-trpl/**"
      - ".github/workflows/deploy-zh-cn-pages.yml"

  # 允许从 GitHub Actions 页面手动运行
  workflow_dispatch:

# 避免多个 Pages 部署同时进行
concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97"
  MDBOOK_VERSION: "0.5.1"

jobs:
  build:
    name: Build Chinese Book
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 下载当前仓库代码
      - name: Checkout repository
        uses: actions/checkout@v6

      # 安装与本书匹配的 Rust 工具链
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"

      # 安装仓库当前使用的 mdBook 版本
      - name: Install mdBook
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="${RUNNER_TEMP}/mdbook-bin"
          echo "${RUNNER_TEMP}/mdbook-bin" >> "${GITHUB_PATH}"

      - name: Report versions
        run: |
          rustc --version
          cargo --version
          mdbook --version

      # 初始化 GitHub Pages 构建环境
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # zh-cn/book.toml 会把结果生成到根目录 book-zh-cn
      - name: Build Chinese Book
        run: mdbook build zh-cn

      # 将生成的静态页面打包为 GitHub Pages artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book-zh-cn

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
